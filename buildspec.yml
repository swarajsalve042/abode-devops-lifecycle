version: 0.2

phases:
  pre_build:
    commands:
      - echo "Preparing Abode Software build"
      - docker --version

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t hshar/webapp:$CODEBUILD_RESOLVED_SOURCE_VERSION .

  post_build:
    commands:
      - echo "Build completed"
      - echo "Branch-aware deployment logic is handled by the CI/CD pipeline"
