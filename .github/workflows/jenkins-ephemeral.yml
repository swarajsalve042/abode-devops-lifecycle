name: Ephemeral Jenkins Pipeline Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Jenkinsfile"
      - ".github/workflows/jenkins-ephemeral.yml"

permissions:
  contents: read

jobs:
  jenkins:
    name: Run Jenkinsfile in temporary Jenkins
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build temporary Jenkins image
        shell: bash
        run: |
          cat > /tmp/Dockerfile.jenkins <<'EOF'
          FROM jenkins/jenkins:lts-jdk21
          USER root
          RUN apt-get update \
              && apt-get install -y --no-install-recommends curl ca-certificates gnupg \
              && curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
              && apt-get install -y --no-install-recommends nodejs \
              && node --version \
              && npm --version \
              && rm -rf /var/lib/apt/lists/*
          RUN jenkins-plugin-cli --plugins workflow-aggregator git
          EOF
          docker build -f /tmp/Dockerfile.jenkins -t temporary-jenkins:ci .

      - name: Configure isolated Jenkins job
        shell: bash
        run: |
          mkdir -p /tmp/jenkins-init
          cat > /tmp/jenkins-init/create-job.groovy <<'EOF'
          import jenkins.model.Jenkins
          import jenkins.model.JenkinsLocationConfiguration
          import hudson.security.AuthorizationStrategy
          import hudson.security.SecurityRealm
          import hudson.plugins.git.GitSCM
          import hudson.plugins.git.BranchSpec
          import org.jenkinsci.plugins.workflow.job.WorkflowJob
          import org.jenkinsci.plugins.workflow.cps.CpsScmFlowDefinition

          def j = Jenkins.get()
          j.setSecurityRealm(SecurityRealm.NO_AUTHENTICATION)
          j.setAuthorizationStrategy(AuthorizationStrategy.UNSECURED)

          def job = j.getItem("repository-pipeline")
          if (job == null) {
              job = j.createProject(WorkflowJob, "repository-pipeline")
          }
          def scm = new GitSCM("https://github.com/swarajsalve042/abode-devops-lifecycle.git")
          scm.branches = [new BranchSpec("*/main")]
          def definition = new CpsScmFlowDefinition(scm, "Jenkinsfile")
          definition.setLightweight(false)
          job.setDefinition(definition)
          job.save()
          JenkinsLocationConfiguration.get().setUrl("http://127.0.0.1:8080/")
          JenkinsLocationConfiguration.get().save()
          j.save()
          println("Configured repository-pipeline for swarajsalve042/abode-devops-lifecycle")
          EOF

          docker run -d --name temporary-jenkins --user root \
            -p 127.0.0.1:8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/jenkins-init:/usr/share/jenkins/ref/init.groovy.d:ro \
            -e JAVA_OPTS="-Djenkins.install.runSetupWizard=false" \
            temporary-jenkins:ci
          docker cp "$(command -v docker)" temporary-jenkins:/usr/local/bin/docker
          docker exec temporary-jenkins docker --version

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/login >/dev/null
          docker logs temporary-jenkins 2>&1 | tail -n 80

      - name: Execute and verify Jenkins pipeline
        shell: bash
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8080"
          initial="$(curl --globoff -fsS "$base/api/json?tree=jobs[name,lastBuild[number]]" | jq -r '.jobs[] | select(.name=="repository-pipeline") | .lastBuild.number // 0')"
          crumb_json="$(curl --globoff -fsS "$base/crumbIssuer/api/json" || true)"
          if [ -n "$crumb_json" ]; then
            crumb_field="$(printf '%s' "$crumb_json" | jq -r '.crumbRequestField')"
            crumb_value="$(printf '%s' "$crumb_json" | jq -r '.crumb')"
            curl -fsS -X POST -H "$crumb_field: $crumb_value" "$base/job/repository-pipeline/build"
          else
            curl -fsS -X POST "$base/job/repository-pipeline/build"
          fi
          build=""
          for attempt in $(seq 1 90); do
            build_json="$(curl --globoff -fsS "$base/job/repository-pipeline/lastBuild/api/json?tree=number,building,result" || true)"
            number="$(printf '%s' "$build_json" | jq -r '.number // 0')"
            if [ "$number" -gt "$initial" ]; then
              build="$number"
              break
            fi
            sleep 2
          done
          test -n "$build" || { echo "Jenkins did not schedule a build"; exit 1; }
          for attempt in $(seq 1 180); do
            build_json="$(curl --globoff -fsS "$base/job/repository-pipeline/$build/api/json?tree=number,building,result")"
            building="$(printf '%s' "$build_json" | jq -r '.building')"
            result="$(printf '%s' "$build_json" | jq -r '.result // "RUNNING"')"
            echo "Jenkins build #$build: $result (building=$building)"
            if [ "$building" = "false" ]; then
              test "$result" = "SUCCESS"
              exit $?
            fi
            sleep 5
          done
          echo "Jenkins build timed out"
          exit 1

      - name: Show Jenkins diagnostics on failure
        if: failure()
        shell: bash
        run: docker logs temporary-jenkins 2>&1 | tail -n 200 || true

      - name: Stop temporary Jenkins
        if: always()
        shell: bash
        run: docker rm -f temporary-jenkins || true
